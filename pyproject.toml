[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang-metis"
version = "0.1.0"
description = "SGLang support for Lernex's Metis-1.6 models (Logos and Praxis)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Lernex" }]
requires-python = ">=3.10"
dependencies = ["sglang>=0.5.22"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/lernex/sglang-metis"
Issues = "https://github.com/lernex/sglang-metis/issues"
Models = "https://huggingface.co/Lernex"

[project.entry-points."sglang.srt.plugins"]
metis = "sglang_metis:register"

[tool.setuptools]
packages = ["sglang_metis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
